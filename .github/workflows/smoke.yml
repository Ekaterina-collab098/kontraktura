name: Public site smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check public page and API
        run: |
          set -e
          curl --fail --show-error --location --retry 3 --retry-delay 5 https://kontraktura.vercel.app/ | grep -q 'productSearch'
          curl --fail --show-error --location --retry 3 --retry-delay 5 https://kontraktura.vercel.app/app.js | grep -q 'downloadWord'
          curl --fail --show-error --location --retry 3 --retry-delay 5 https://kontraktura.vercel.app/api/status | grep -q '"cards"'
          curl --fail --show-error --location --retry 3 --retry-delay 5 'https://kontraktura.vercel.app/api/catalog?q=mic' | grep -q '"items"'
